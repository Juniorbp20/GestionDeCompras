name: Android CI

on:
  # Compila y prueba en cada push a cualquier rama (no solo al publicar)
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        shell: bash
        run: chmod +x gradlew

      - name: Compilar APK
        shell: bash
        run: ./gradlew assembleDebug

      - name: Ejecutar tests
        shell: bash
        run: ./gradlew testDebugUnitTest

      - name: Publicar reporte de tests
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: "Resultados de tests"
          path: "app/build/test-results/testDebugUnitTest/*.xml"
          reporter: "java-junit"
          fail-on-error: "false"

      - name: Mostrar esquema de la base de datos
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          for f in app/schemas/*/8.json; do
            echo "=====INICIO_ESQUEMA $f"
            base64 -w0 "$f"; echo
            echo "=====FIN_ESQUEMA"
          done

      - name: Subir esquema de la base de datos
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: "room-schemas"
          path: "app/schemas/"
          if-no-files-found: warn

      - name: Subir APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "apk-${{ matrix.os }}"
          path: "app/build/outputs/apk/debug/app-debug.apk"

  # Pruebas instrumentadas (base de datos y servicios) en un emulador
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Habilitar KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ejecutar pruebas instrumentadas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: chmod +x gradlew && ./gradlew connectedDebugAndroidTest

      - name: Subir reporte de pruebas instrumentadas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "reporte-instrumentadas"
          path: "app/build/reports/androidTests/connected/"
          if-no-files-found: ignore
